{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<h2>Register</h2>
<form method="POST" action="/register">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
        <label for="username" class="form-label">Email</label>
        <input type="email" class="form-control" id="username" name="username" required maxlength="120">
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" required>
        <small class="form-text text-muted">At least 10 chars, uppercase, digit, special, not on blacklist.</small>
    </div>
    <div class="mb-3">
        <label for="bio" class="form-label">Biography</label>
        <textarea class="form-control" id="bio" name="bio" rows="3" maxlength="1000" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Register</button>
</form>
{% endblock %}
